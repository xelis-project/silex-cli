[package]
name = "silex-cli"
version = "1.0.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"

xelis-abi = { git = "https://github.com/xelis-project/xelis-vm", tag = "v1.0.0" }
