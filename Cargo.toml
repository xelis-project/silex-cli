[package]
name = "silex-cli"
version = "1.0.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"

silex-abi = { git = "https://github.com/xelis-project/xelis-vm", tag = "v1.4.0" }
silex-assembler = { git = "https://github.com/xelis-project/xelis-vm", tag = "v1.4.0" }
silex-builder = { git = "https://github.com/xelis-project/xelis-vm", tag = "v1.4.0" }
silex-bytecode = { git = "https://github.com/xelis-project/xelis-vm", tag = "v1.4.0" }
silex-compiler = { git = "https://github.com/xelis-project/xelis-vm", tag = "v1.4.0" }
silex-environment = { git = "https://github.com/xelis-project/xelis-vm", tag = "v1.4.0" }
silex-lexer = { git = "https://github.com/xelis-project/xelis-vm", tag = "v1.4.0" }
silex-parser = { git = "https://github.com/xelis-project/xelis-vm", tag = "v1.4.0" }
silex-types = { git = "https://github.com/xelis-project/xelis-vm", tag = "v1.4.0" }
silex-decompiler = { git = "https://github.com/xelis-project/xelis-vm", tag = "v1.4.0" }
xelis-vm = { git = "https://github.com/xelis-project/xelis-vm", tag = "v1.4.0" }
xelis_common = { git = "https://github.com/xelis-project/xelis-blockchain", branch = "dev" }
